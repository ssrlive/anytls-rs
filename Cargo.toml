[package]
name = "anytls"
version = "0.3.13"
edition = "2024"
authors = ["anytls-rs contributors"]
description = "A proxy protocol that attempts to mitigate the TLS in TLS fingerprinting problem"
license = "MIT"
repository = "https://github.com/ssrlive/anytls-rs"
keywords = ["proxy", "tls", "privacy", "networking"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "anytls-client"
path = "bin/client.rs"
required-features = ["client_runner"]

[[bin]]
name = "anytls-server"
path = "bin/server.rs"
required-features = ["server"]

[features]
default = ["client_runner", "server"]
core = []
runtime = ["core", "dep:async-trait", "dep:futures", "dep:tokio"]
uot = ["dep:socks5-impl", "dep:tokio"]
client_runner = ["client"]
client = [
    "runtime",
    "uot",
    "dep:clap",
    "dep:ctrlc2",
    "dep:env_logger",
    "dep:indexmap",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-native-certs",
    "dep:sha2",
    "dep:socket2",
    "dep:socks5-impl",
    "dep:tokio-rustls",
    "dep:tokio-util",
    "dep:url",
    "dep:uuid",
    "dep:serde",
    "socks-hub/httpproxy",
]
server = [
    "runtime",
    "uot",
    "dep:clap",
    "dep:ctrlc2",
    "dep:env_logger",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:sha2",
    "dep:socket2",
    "dep:socks5-impl",
    "dep:tokio-rustls",
    "dep:tokio-util",
    "dep:x509-parser",
    "dep:rustls-native-certs",
    "socks5-impl/client",
    "dep:uuid",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:url",
]

[dependencies]
async-trait = { version = "0.1.91", optional = true }
bytes = "1.12.1"
clap = { version = "4.6.5", features = [
    "derive",
    "wrap_help",
    "cargo",
], optional = true }
ctrlc2 = { version = "4.0.0", features = [
    "termination",
    "async",
], optional = true }
env_logger = { version = "0.11.11", optional = true }
futures = { version = "0.3.33", optional = true }
indexmap = { version = "2.14.0", optional = true }
log = { version = "0.4.33", features = ["serde"] }
md5 = "0.8.1"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
rand = "0.10.2"
rcgen = { version = "0.14.8", optional = true }
reqwest = { version = "0.13.4", optional = true, features = ["json", "rustls"] }
rustls = { version = "0.23.43", optional = true }
rustls-native-certs = { version = "0.8.4", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }
socket2 = { version = "0.6.5", optional = true }
socks-hub = { version = "0.2.9", default-features = false, features = [
    "httpproxy",
], optional = true }
socks5-impl = { version = "0.9.6", features = [
    "server",
    "serde",
], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
tokio-util = { version = "0.7.19", optional = true }
url = { version = "2.5.8", features = ["serde"], optional = true }
uuid = { version = "1.24.0", features = ["v4", "serde"], optional = true }
x509-parser = { version = "0.18.1", optional = true }
